:root{
  --bg:#FFFFFF; --bg2:#F1F4F9; --ink:#121A2B; --muted:#5A6478; --line:#DCE2EC;
  --green:#1B3A6B; --green2:#132C52; --on-green:#FFFFFF; --tur:#E3A21A; --tur-soft:#FBEFD0; --tur-ink:#7A5200;
  --red:#B93A2A; --ok:#1E7A4E; --water:#CFDDF0; --sky:#EAF0F8;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0C1220; --bg2:#141C2E; --ink:#E8ECF4; --muted:#9EA9BF; --line:#24304A;
  --green:#2F5FB8; --green2:#7FA6EE; --on-green:#FFFFFF; --tur:#F0B43C; --tur-soft:#3A2F14; --tur-ink:#F6CF7A;
  --red:#E58A7C; --ok:#6CC191; --water:#1B2C4A; --sky:#111A2C; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0C1220; --bg2:#141C2E; --ink:#E8ECF4; --muted:#9EA9BF; --line:#24304A;
  --green:#2F5FB8; --green2:#7FA6EE; --on-green:#FFFFFF; --tur:#F0B43C; --tur-soft:#3A2F14; --tur-ink:#F6CF7A;
  --red:#E58A7C; --ok:#6CC191; --water:#1B2C4A; --sky:#111A2C; color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manjari","Noto Sans Malayalam",system-ui,sans-serif;font-size:1.0625rem;line-height:1.7;-webkit-font-smoothing:antialiased}
.disp{font-family:"Anek Malayalam","Manjari",system-ui,sans-serif;font-variation-settings:"wdth" 88}
.de{font-family:"Newsreader",Georgia,"Times New Roman",serif}
a{color:var(--green)}
:focus-visible{outline:3px solid var(--tur);outline-offset:3px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.narrow{max-width:820px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px 24px;min-height:68px;flex-wrap:wrap;padding:8px 0}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand .mark{width:34px;height:34px;flex:none}
.brand b{font-family:"Anek Malayalam",sans-serif;font-weight:700;font-size:1.15rem;line-height:1;font-variation-settings:"wdth" 90}
.brand small{display:block;font-family:"Newsreader",serif;font-style:italic;color:var(--muted);font-size:.9rem;line-height:1.2}
.right{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
nav.links{display:flex;gap:22px}
nav.links a{text-decoration:none;color:var(--muted);font-size:.98rem;padding:4px 0;border-bottom:2px solid transparent}
nav.links a:hover{color:var(--ink)}
nav.links a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--tur)}
.toggle{display:inline-flex;background:var(--bg2);border-radius:8px;padding:3px}
.toggle button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:.9rem;padding:6px 12px 3px;border-radius:6px;cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgba(18,26,43,.14)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:var(--on-green);text-decoration:none;border:0;border-radius:6px;padding:13px 22px 10px;font:inherit;font-weight:700;cursor:pointer;transition:background .15s}
.btn:hover{background:var(--green2)}
a.btn{color:var(--on-green)}
.link{font-weight:700;text-decoration:none;color:var(--green);border-bottom:2px solid var(--tur);padding-bottom:1px}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) a,:root:not([data-theme="light"]) .link{color:var(--green2)} :root:not([data-theme="light"]) a.btn{color:var(--on-green)} }
:root[data-theme="dark"] a,:root[data-theme="dark"] .link{color:var(--green2)} :root[data-theme="dark"] a.btn{color:var(--on-green)}

/* home hero */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;padding:56px 0 64px}
.kicker{color:var(--tur-ink);font-weight:700;margin:0 0 14px}
.hero h1{font-family:"Anek Malayalam",sans-serif;font-weight:800;font-variation-settings:"wdth" 82;font-size:clamp(2.6rem,6.2vw,4.6rem);line-height:1.08;margin:0 0 18px;letter-spacing:-.015em}
.hero .sub{font-size:1.15rem;color:var(--muted);max-width:30em;margin:0 0 28px}
.hero .cta{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.art svg{width:100%;height:auto;display:block}
.demo{margin-top:36px;display:flex;align-items:center;gap:18px;padding:18px 20px;border:1px solid var(--line);border-left:4px solid var(--tur);border-radius:8px;background:var(--bg);max-width:30rem}
.demo .w{flex:1;min-width:0}
.demo .g{font-family:"Newsreader",serif;font-size:1.7rem;line-height:1.15;font-weight:500}
.demo .p{color:var(--muted);font-size:.98rem}
.demo .next{background:none;border:0;color:var(--muted);font:inherit;font-size:.9rem;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:4px}
.play{width:46px;height:46px;border-radius:50%;border:0;background:var(--green);color:var(--on-green);cursor:pointer;display:inline-grid;place-items:center;padding:0;flex:none;transition:transform .12s}
.play:active{transform:scale(.94)}
.play svg{width:18px;height:18px}
.play.sm{width:38px;height:38px;background:var(--bg2);color:var(--green)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .play.sm{color:var(--green2)} }
:root[data-theme="dark"] .play.sm{color:var(--green2)}

/* levels */
.levels{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:0 0 72px}
.lv{position:relative;overflow:hidden;border-radius:14px;padding:36px 36px 32px;min-height:300px;display:flex;flex-direction:column;text-decoration:none}
.lv.a1{background:var(--green);color:#fff}
.lv.a2{background:var(--tur-soft);color:var(--ink)}
.lv .big{font-family:"Newsreader",serif;font-weight:600;font-size:6.5rem;line-height:.85;letter-spacing:-.03em}
.lv h2{font-family:"Anek Malayalam",sans-serif;font-variation-settings:"wdth" 88;font-size:1.6rem;margin:22px 0 6px;line-height:1.25}
.lv p{margin:0 0 24px;max-width:24em;opacity:.88}
.lv .go{margin-top:auto;font-weight:700;display:inline-flex;gap:8px;align-items:center}
.lv .deco{position:absolute;right:-20px;top:-10px;width:220px;opacity:.16;pointer-events:none}
.lv.a2 .deco{opacity:.35}
.lv:hover .go span{text-decoration:underline;text-underline-offset:4px}

/* verb-at-the-end feature */
.feature{background:var(--bg2);padding:72px 0}
.feature .grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;align-items:center}
.feature h2,.sec-h{font-family:"Anek Malayalam",sans-serif;font-weight:700;font-variation-settings:"wdth" 86;font-size:clamp(1.7rem,3.6vw,2.4rem);line-height:1.2;margin:0 0 14px}
.feature p{color:var(--muted);margin:0 0 12px;max-width:28em}
.sent{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.sent span{padding:9px 12px 6px;border-radius:6px;background:var(--bg);border:1px solid var(--line);font-size:1.05rem}
.sent span.v{background:var(--tur);border-color:var(--tur);color:#2A1C00;font-weight:700}
.sent.de span{font-family:"Newsreader",serif;font-size:1.15rem}
.sent-l{font-size:.88rem;color:var(--muted);margin:18px 0 6px}

/* exam teaser */
.teaser{padding:72px 0}
.teaser .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px}
.tcard{border:1px solid var(--line);border-radius:12px;padding:26px 26px 22px;text-decoration:none;color:var(--ink);display:block;transition:border-color .15s}
.tcard:hover{border-color:var(--green)}
.tcard h3{font-family:"Newsreader",serif;font-weight:600;font-size:1.4rem;margin:0 0 14px}
.tcard .meta{display:flex;gap:28px;margin-top:14px;color:var(--muted);font-size:.95rem}
.tcard .meta b{display:block;font-family:"Newsreader",serif;font-size:1.6rem;color:var(--ink);font-weight:600;line-height:1.1}

/* generic page */
.crumb{color:var(--muted);font-size:.92rem;margin:28px 0 0}
.crumb a{color:var(--muted);text-decoration:none}
.crumb a:hover{color:var(--ink)}
.phead{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;margin:24px 0 32px}
.badge{width:88px;height:88px;border-radius:20px;background:var(--tur-soft);color:var(--tur-ink);display:grid;place-items:center}
.badge svg{width:44px;height:44px}
h1.page{font-family:"Anek Malayalam",sans-serif;font-weight:800;font-variation-settings:"wdth" 84;font-size:clamp(2rem,5vw,3.1rem);line-height:1.12;margin:0;letter-spacing:-.01em}
.phead .de{color:var(--muted);font-style:italic;font-size:1.2rem;margin:6px 0 0}
.progress{height:4px;background:var(--line);border-radius:2px;margin:0 0 36px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--tur)}
.lead{color:var(--muted);max-width:36em;margin:0 0 36px;font-size:1.1rem}

/* level path */
.path{list-style:none;margin:0 0 48px;padding:0;position:relative}
.path::before{content:"";position:absolute;left:27px;top:28px;bottom:28px;width:2px;background:var(--line)}
.path li a{position:relative;display:grid;grid-template-columns:56px 1fr auto;gap:20px;align-items:center;padding:12px 12px 12px 0;text-decoration:none;color:var(--ink);border-radius:10px}
.path li a:hover{background:var(--bg2)}
.node{width:56px;height:56px;border-radius:50%;background:var(--bg);border:2px solid var(--line);display:grid;place-items:center;color:var(--green);position:relative;z-index:1}
.node svg{width:24px;height:24px}
.path .ok .node{background:var(--green);border-color:var(--green);color:#fff}
.path .t b{display:block;font-weight:700;font-size:1.08rem;line-height:1.35}
.path .t small{font-family:"Newsreader",serif;font-style:italic;color:var(--muted);font-size:1rem}
.path .n{font-family:"Newsreader",serif;color:var(--muted);font-size:.95rem;white-space:nowrap}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .node{color:var(--green2)} }
:root[data-theme="dark"] .node{color:var(--green2)}

/* phrases */
.cols{display:grid;grid-template-columns:120px 1fr 1fr 46px;gap:0 20px;font-size:.85rem;color:var(--muted);padding:0 0 8px;border-bottom:1px solid var(--line)}
.ph{display:grid;grid-template-columns:1fr 1fr 46px;gap:6px 20px;align-items:center;padding:16px 0 14px;border-bottom:1px solid var(--line)}
.ph .g{font-family:"Newsreader",serif;font-size:1.4rem;line-height:1.25;font-weight:500}
.ph .s{color:var(--muted);font-size:.98rem;margin-top:2px}
.ph .m{font-size:1.02rem}
.hdr{display:grid;grid-template-columns:1fr 1fr 46px;gap:20px;font-size:.85rem;color:var(--muted);padding:0 0 8px;border-bottom:2px solid var(--ink)}
.note{display:grid;grid-template-columns:auto 1fr;gap:16px;margin:32px 0 0;padding:22px 24px 18px;background:var(--tur-soft);border-radius:12px}
.note svg{width:26px;height:26px;color:var(--tur-ink);margin-top:2px}
.note b{display:block;color:var(--tur-ink);margin-bottom:2px}
.quiz{margin:48px 0 0;border:1px solid var(--line);border-radius:12px;padding:8px 24px 18px}
.quiz h2{font-family:"Anek Malayalam",sans-serif;font-variation-settings:"wdth" 88;font-size:1.35rem;margin:16px 0 4px}
.q{padding:16px 0 10px;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q p{margin:0 0 12px;font-weight:700}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opt{background:var(--bg);border:1.5px solid var(--line);color:var(--ink);border-radius:8px;padding:10px 16px 7px;font:inherit;cursor:pointer;transition:border-color .12s}
.opt:hover:not([disabled]){border-color:var(--green)}
.opt.de{font-size:1.12rem}
.opt[disabled]{cursor:default}

 {de:"Nebensätze", t:["weil, dass, wenn: verb last","weil, dass, wenn: verb last"],

let deVoice = null; const synth = window.speechSynthesis;
function pickVoice(){ if(!synth) return; const v = synth.getVoices(); deVoice = v.find(x=>x.lang==="de-DE") || v.find(x=>x.lang && x.lang.toLowerCase().startsWith("de")) || null; }
if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; }
function speak(t){

}

const micBtn = (t) => `<div class="micwrap"><button class="micbtn" data-target="${esc(t)}">${ico("mic")}<span>${u("sayIt")}</span></button><div class="micres" aria-live="polite"></div></div>`;
function listenFor(btn){
  const res = btn.parentElement.querySelector(".micres"), target = btn.dataset.target;
  if (!SR) { res.className="micres no"; res.textContent = u("micNo"); return; }
  let r; try { r = new SR(); } catch(e){ res.className="micres no"; res.textContent = u("micNo"); return; }
  r.lang = "de-DE"; r.interimResults = false; r.maxAlternatives = 3;
  btn.classList.add("rec"); res.className="micres"; res.textContent = u("listening");
  r.onresult = ev => {
    const tw = norm(target).split(" ").filter(Boolean); let best = {s:-1,t:""};
    for (const alt of ev.results[0]) { const hw = norm(alt.transcript).split(" "); const hit = tw.filter(w=>hw.includes(w)).length; const s = Math.round(hit/tw.length*100); if (s>best.s) best={s,t:alt.transcript}; }
    res.className = "micres " + (best.s>=80?"ok":best.s>=50?"mid":"no");
    res.innerHTML = `<b>${u("match")}: ${best.s}%</b>, ${u("heard")}: “${esc(best.t)}”`;
  };
  r.onerror = ev => { res.className="micres no"; res.textContent = (ev.error==="not-allowed"||ev.error==="service-not-allowed") ? u("micErr") : u("micNo"); };
  r.onend = () => btn.classList.remove("rec");
  try { r.start(); } catch(e){ btn.classList.remove("rec"); res.className="micres no"; res.textContent=u("micNo"); }
}

let TS = null;
function viewTalk(n){

  return `<div class="wrap narrow">${crumb(`<a href="#talk">${u("nav_talk")}</a>`, String(n))}

function talkRender(autoplay){
  const el = document.getElementById("chat"); if(!el||!TS) return;
  const s = TALK[TS.n-1]; let h = "";
  for (let i=0;i<TS.step;i++){ const st = s.steps[i]; h += bubbleN(st, false) + `<div class="bub me" lang="de">${esc(TS.said[i])}</div>`; }
  if (TS.step < s.steps.length) {
    const st = s.steps[TS.step];
    h += bubbleN(st, true);
    h += `<div class="answers">${st.o.map((o,j)=>{
      const st8 = TS.picked===j ? (o.ok?" right":" wrong") : TS.wrong.includes(j) ? " wrong" : "";
      const dis = TS.picked!==null && st.o[TS.picked].ok ? " disabled" : (TS.wrong.includes(j)?" disabled":"");
      return `<button class="ans${st8}" data-j="${j}" lang="de"${dis}>${esc(o.d)}</button>`; }).join("")}</div>`;
    if (TS.picked!==null) {
      const o = st.o[TS.picked];
      h += `<div class="tfb ${o.ok?"ok":"no"}"><b>${o.ok?u("right"):u("tryAgain")}</b> ${esc(L(o.fb))}</div>`;
      if (o.ok) h += micBtn(o.d) + `<div class="rowbtn"><button class="btn" id="tnext">${u("cont")} →</button></div>`;
    }
  } else {
    DONE["talk-"+TS.n]=1; saveDone();
    h += `<div class="tdone"><h2>${u("talkDone")}</h2><p class="small">${u("usedP")}</p><ul class="said">${TS.said.map(x=>`<li lang="de">${esc(x)} ${playBtn(x,1)}</li>`).join("")}</ul>
      <div class="rowbtn"><button class="btn ghost2 sm" id="tagain">${u("again2")}</button>${TS.n<TALK.length?`<a class="btn sm" href="#talk-${TS.n+1}">${u("nextTalk")} →</a>`:`<a class="btn sm" href="#daily">${u("nav_daily")} →</a>`}</div></div>`;
  }
  el.innerHTML = h;
  if (autoplay && TS.step < s.steps.length) { const line = s.steps[TS.step].n; setTimeout(()=>speak(line), 250); }
}
function bubbleN(st, current){
  return `<div class="bub them"><div class="brow"><span lang="de">${esc(st.n)}</span>${playBtn(st.n,1)}</div>${current?`<button class="trbtn">${u("showTr")}</button><div class="tr" hidden>${esc(L(st.tr))}</div>`:`<div class="tr">${esc(L(st.tr))}</div>`}</div>`;
}

function route(){
  const h = location.hash.replace(/^#/,""); let m; CUR = null; RES = {}; FC = null; TS = null; if (TIMER) { clearInterval(TIMER); TIMER = null; }
  if (h==="a1"||h==="a2") app.innerHTML = viewLevel(h);
  else if ((m = h.match(/^(a1|a2)-(\d+)$/))) { app.innerHTML = viewLesson(m[1], +m[2]); const l = LEVELS[m[1]][+m[2]-1]; if (l) fcStart(l.w); }
  else if (h==="talk") app.innerHTML = viewTalkList();
  else if ((m = h.match(/^talk-(\d+)$/))) { app.innerHTML = viewTalk(+m[1]); if (TS) talkRender(false); }
  else if (h==="real") app.innerHTML = viewReal();
  else if (h==="culture") app.innerHTML = viewCulture();
  else if (h==="daily") app.innerHTML = viewDaily();
  else if (h==="grammar") app.innerHTML = viewGrammar();
  else if (h==="method") app.innerHTML = viewMethod();
  else app.innerHTML = viewHome();
  const cur = (re) => re.test(h) ? ' aria-current="page"' : "";
  document.getElementById("nav").innerHTML =
    `<a href="#a1"${cur(/^a[12]/)}>${u("nav_lessons")}</a><a href="#talk"${cur(/^talk/)}>${u("nav_talk")}</a><a href="#real"${cur(/^real/)}>${u("nav_real")}</a><a href="#culture"${cur(/^culture/)}>${u("nav_culture")}</a><a href="#daily"${cur(/^daily/)}>${u("nav_daily")}</a><a href="#method"${cur(/^method/)}>${u("nav_method")}</a>`;
  document.getElementById("menubtn").textContent = u("menu");
  document.body.classList.remove("menu-open");
  document.getElementById("foot").textContent = u("foot");
  document.querySelectorAll(".toggle button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.s===S?"true":"false"));
  document.documentElement.lang = S==="ml" ? "ml" : "en";
}

  if (e.target.closest("#menubtn")) { document.body.classList.toggle("menu-open"); return; }
  const sp = e.target.closest(".speed button"); if (sp) { RATE = +sp.dataset.rate; try{localStorage.setItem("dp-rate", RATE);}catch(err){} document.querySelectorAll(".speed button").forEach(b=>b.setAttribute("aria-pressed", String(+b.dataset.rate===RATE))); return; }
  const j = e.target.closest(".jump a"); if (j) { e.preventDefault(); const t = document.getElementById(j.dataset.to); if (t) t.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); return; }
  if (e.target.closest("#nextdemo")) { di = (di+1) % DEMO.length; document.getElementById("demo").innerHTML = demoHTML(); return; }
  const t = e.target.closest(".toggle button");
  if (t) { S = t.dataset.s; try{ localStorage.setItem("dp-script", S); }catch(err){} const y = window.scrollY; const keepTS = TS; route(); if (keepTS && TS) { Object.assign(TS, keepTS); talkRender(false); } window.scrollTo(0,y); return; }

  /* talk */
  if (TS) {
    const tr = e.target.closest(".trbtn"); if (tr) { const d = tr.nextElementSibling; d.hidden = !d.hidden; return; }
    const a = e.target.closest(".ans");
    if (a && !a.disabled) { const st = TALK[TS.n-1].steps[TS.step], jj = +a.dataset.j; TS.picked = jj; if (!st.o[jj].ok) TS.wrong.push(jj); talkRender(false); if (st.o[jj].ok) speak(st.o[jj].d); return; }
    if (e.target.closest("#tnext")) { const st = TALK[TS.n-1].steps[TS.step]; TS.said.push(st.o[TS.picked].d); TS.step++; TS.picked=null; TS.wrong=[]; talkRender(true); document.getElementById("chat").lastElementChild?.scrollIntoView({block:"nearest"}); return; }
    if (e.target.closest("#tagain")) { TS = {n:TS.n, step:0, picked:null, wrong:[], said:[]}; talkRender(true); return; }
  }
  /* daily */
  if (e.target.closest("#pnew")) { PI = (PI+1+Math.floor(Math.random()*(PROMPTS.length-1))) % PROMPTS.length; if (TIMER){clearInterval(TIMER);TIMER=null;} document.getElementById("prompt").innerHTML = promptHTML(); return; }
  if (e.target.closest("#ptimer")) { let left = 120; const tl = document.getElementById("tleft"); if (TIMER) clearInterval(TIMER); tl.textContent = "2:00"; TIMER = setInterval(()=>{ left--; tl.textContent = left>0 ? `${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}` : u("timeUp"); if (left<=0){ clearInterval(TIMER); TIMER=null; } }, 1000); return; }
  if (e.target.closest("#newmix")) { document.getElementById("mixwrap").innerHTML = exBlock(u("mixH"), pickMix(), null); return; }

  /* flashcards */
  if (FC) {
    if (e.target.closest("#fcard")) { FC.flip = !FC.flip; fcRender(); return; }
    if (e.target.closest("#fcknow")) { FC.q.shift(); FC.flip=false; fcRender(); return; }
    if (e.target.closest("#fcagain")) { FC.q.push(FC.q.shift()); FC.flip=false; fcRender(); return; }
    if (e.target.closest("#fcre")) { fcStart(FC.rows); return; }
  }

  /* exercises */
  if (!CUR) return;
  if (e.target.closest("#resetall")) { RES = {}; document.querySelectorAll("#exlist .ex").forEach(b=>{ const i=+b.dataset.i; b.outerHTML = exHTML(CUR.ex[i], i); }); updScore(); return; }
  const o = e.target.closest(".opt");
  if (o && !o.disabled) {
    const box = o.closest(".ex"), ex = CUR.ex[+box.dataset.i], jj = +o.dataset.j;
    const all = box.querySelectorAll(".opt"); all.forEach(x=>x.disabled=true); all[ex.a].classList.add("right");
    if (jj!==ex.a) o.classList.add("wrong");
    mark(box, jj===ex.a, L(ex.o[ex.a])); return;
  }
  const chip = e.target.closest(".chip");
  if (chip && !chip.disabled) {
    const box = chip.closest(".ex"); if (box.classList.contains("is-ok")||box.classList.contains("is-no")) return;
    const built = box.querySelector(".built");
    if (chip.parentElement === built) { const src = [...box.querySelectorAll(".chips .chip[disabled]")].find(x=>x.dataset.w===chip.dataset.w); if (src) src.disabled = false; chip.remove(); }
    else { chip.disabled = true; const b = document.createElement("button"); b.className="chip in"; b.dataset.w = chip.dataset.w; b.textContent = chip.dataset.w; built.appendChild(b); }
    return;
  }
  if (e.target.closest(".reset-o")) { const box = e.target.closest(".ex"); const i=+box.dataset.i; delete RES[i]; box.outerHTML = exHTML(CUR.ex[i], i); updScore(); return; }
  const chk = e.target.closest(".chk");
  if (chk) {
    const box = chk.closest(".ex"); if (box.classList.contains("is-ok")||box.classList.contains("is-no")) return;
    const ex = CUR.ex[+box.dataset.i];
    if (ex.t==="fill") {
      const inp = box.querySelector(".blank"); const v = inp.value; if (!v.trim()) { inp.focus(); return; }
      const ok = ex.a.some(a => norm(a)===norm(v)); inp.disabled = true; inp.classList.add(ok?"ok":"no"); mark(box, ok, ex.a[0]);
    } else if (ex.t==="order") {
      const v = [...box.querySelectorAll(".built .chip")].map(x=>x.dataset.w).join(" "); if (!v) return;
      const ok = ex.a.some(a => norm(a)===norm(v)); box.querySelectorAll(".chip").forEach(x=>x.disabled=true); mark(box, ok, ex.a[0]);
    }
  }
});
route();
</script>
</body>
</html>
